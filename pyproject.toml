[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betwise"
version = "0.1.0"
description = "BetWise AI: motor estadístico de pronósticos deportivos (fase 0: fútbol, validación contra el mercado)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
